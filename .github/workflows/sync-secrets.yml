name: Sync secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets to bouquet-of-flowers
        env:
          VERCEL_REFRESH_TOKEN: ${{ secrets.VERCEL_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "$VERCEL_REFRESH_TOKEN" | GH_TOKEN="$GH_PAT" gh secret set VERCEL_REFRESH_TOKEN -R jTxixz/bouquet-of-flowers
          echo "$GH_PAT" | GH_TOKEN="$GH_PAT" gh secret set GH_PAT -R jTxixz/bouquet-of-flowers
