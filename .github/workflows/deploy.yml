name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Vercel OAuth token
        id: auth
        env:
          VERCEL_REFRESH_TOKEN: ${{ secrets.VERCEL_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          RESP=$(curl -sS -X POST https://api.vercel.com/login/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'client_id=cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp' \
            -d 'grant_type=refresh_token' \
            --data-urlencode "refresh_token=$VERCEL_REFRESH_TOKEN")
          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          NEW_RT=$(echo "$RESP" | jq -r '.refresh_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "token refresh failed: $(echo "$RESP" | jq -r '.error // "unknown"')"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          [ -n "$NEW_RT" ] && echo "::add-mask::$NEW_RT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW_RT" ]; then
            echo "$NEW_RT" | GH_TOKEN="$GH_PAT" gh secret set VERCEL_REFRESH_TOKEN -R "$GITHUB_REPOSITORY"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: vercel project create flower-gift --token="$VERCEL_TOKEN" || true

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN" --project flower-gift
